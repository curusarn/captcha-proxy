  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const rc = rough.svg(svg), ink = css('--ink'), muted = css('--muted');
    const o = x => Object.assign({roughness: 1.2, stroke: ink, strokeWidth: 2, seed: 3}, x || {});

    const img = (href, x, y, s) => { const i = document.createElementNS(NS, 'image');

      i.setAttribute('width', s); i.setAttribute('height', s); add(i); };
    const text = (x, y, s, size, color, weight) => { const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', x); t.setAttribute('y', y); t.setAttribute('font-size', size);
      t.setAttribute('text-anchor', 'middle'); if (weight) t.setAttribute('font-weight', weight);

      add(rc.line(x2, y2, x2 - L * Math.cos(a - 0.5), y2 - L * Math.sin(a - 0.5), o({seed: seed + 1, stroke: c})));

    add(rc.ellipse(840, Y, 48, 108, o({seed: 12})));
    add(rc.line(840, Y - 54, 840, Y + 54, o({seed: 13})));
    add(rc.line(786, Y, 894, Y, o({seed: 14})));
